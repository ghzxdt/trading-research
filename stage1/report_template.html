<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: #f0efec;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --status-good: #0ca30c;
  --status-warning: #fab219;
  --status-neutral: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface-1: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --wash: #383835;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
  --text-muted: #898781; --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --wash: #383835; --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
}
* { box-sizing: border-box; }
body { margin: 0; }
.viz-root {
  background: var(--page); color: var(--text-primary); min-height: 100vh;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 15px; line-height: 1.5;
  padding: 32px 20px 64px;
}
.wrap { max-width: 1000px; margin: 0 auto; }
h1 { font-size: 26px; line-height: 1.25; margin: 0 0 6px; font-weight: 650; }
h2 { font-size: 20px; line-height: 1.3; margin: 2px 0 6px; font-weight: 650; }
h3 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
p { margin: 0 0 10px; }
.sub, .question, figcaption .subtitle, .muted { color: var(--text-secondary); }
.small { font-size: 13px; }
a { color: var(--series-1); }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; margin: 18px 0; }
.eyebrow { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; margin-top: 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 14px 0 6px; }
.tile { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .label { font-size: 13px; color: var(--text-secondary); }
.tile .value { font-size: 24px; font-weight: 600; line-height: 1.25; margin: 2px 0; }
.tile .note { font-size: 12px; color: var(--text-muted); }
.findings { list-style: none; padding: 0; margin: 14px 0 4px; }
.findings li { display: grid; grid-template-columns: 128px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--grid); }
.findings li:first-child { border-top: none; }
.findings .headline { font-weight: 600; }
.findings .detail { color: var(--text-secondary); font-size: 14px; margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; white-space: nowrap; height: 24px; }
.chip .icon { width: 18px; height: 18px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1; color: #ffffff; }
.chip.edge .icon { background: var(--status-good); }
.chip.hint .icon { background: var(--status-warning); color: #0b0b0b; }
.chip.none .icon { background: var(--status-neutral); }
.chip.fact .icon { background: transparent; color: var(--text-secondary); box-shadow: inset 0 0 0 1.5px var(--text-muted); }
.chip.ok .icon { background: var(--status-good); }
.chip.note .icon { background: transparent; color: var(--text-secondary); box-shadow: inset 0 0 0 1.5px var(--text-muted); }
.chip.warn .icon { background: var(--status-warning); color: #0b0b0b; font-weight: 700; }
.banner { background: var(--surface-1); border: 1px solid var(--border); border-left: 4px solid var(--status-warning); border-radius: 10px;
  padding: 12px 16px; margin: 0 0 18px; font-size: 14px; }
.banner ul { margin: 6px 0 6px; padding-left: 18px; }
table.health td { text-align: left; white-space: normal; vertical-align: top; }
table.health th { text-align: left; }
table.health td:first-child { white-space: nowrap; }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 10px 0 4px; font-size: 13px; color: var(--text-secondary); }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.key-line { width: 16px; height: 2px; border-radius: 1px; display: inline-block; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
figure { margin: 22px 0 6px; }
figcaption .title { font-weight: 600; }
figcaption .subtitle { font-size: 13px; }
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus { outline: 2px solid var(--series-1); outline-offset: 4px; border-radius: 4px; }
.chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 150px; display: none; z-index: 2; }
.tooltip .tt-title { color: var(--text-secondary); font-size: 12px; margin-bottom: 4px; }
.tooltip .tt-row { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tooltip .tt-row strong { font-weight: 650; color: var(--text-primary); }
.tooltip .tt-row .name { color: var(--text-secondary); }
details { margin: 10px 0 0; }
summary { cursor: pointer; color: var(--text-secondary); font-size: 14px; padding: 4px 0; }
summary:hover { color: var(--text-primary); }
.table-wrap { overflow-x: auto; margin: 6px 0 12px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
caption { text-align: left; font-weight: 600; padding: 8px 0 6px; font-size: 13px; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; }
th { color: var(--text-secondary); font-weight: 600; }
.score { display: flex; flex-wrap: wrap; gap: 10px 22px; margin: 12px 0; }
.score .chip { font-weight: 500; }
.score .chip b { font-weight: 650; }
.edges-list { margin: 6px 0 0; padding-left: 18px; }
footer { font-size: 13px; color: var(--text-secondary); }
footer ul { padding-left: 18px; margin: 6px 0; }
.hub-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 0 0 22px; }
.hub-tabs a { padding: 8px 14px; font-size: 14px; font-weight: 600; color: var(--text-secondary); text-decoration: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px; }
.hub-tabs a:hover { color: var(--text-primary); }
.hub-tabs a[aria-current="page"] { color: var(--text-primary); border-bottom-color: var(--text-primary); }
.tab-badge { margin-left: 6px; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 9px; border: 1px solid var(--border); color: var(--text-secondary); }
.tab-badge[data-temp="hot"] { background: var(--status-warning); color: #0b0b0b; border-color: transparent; }
.tab-badge[data-temp="warm"] { border-color: var(--status-warning); color: var(--text-primary); }
.temp-bar { display: flex; gap: 4px; margin: 10px 0 12px; }
.temp-seg { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; color: var(--text-muted); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.temp-seg b { font-size: 15px; color: var(--text-secondary); }
.temp-seg.on { border: 2px solid var(--text-primary); color: var(--text-primary); background: var(--wash); }
.temp-seg.on b { color: var(--text-primary); }
.temp-seg.on b::before { content: "\25CF  "; }
.refresh-steps { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 10px 0; }
.btn { display: inline-flex; align-items: center; font: inherit; font-size: 14px; font-weight: 600; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--text-secondary);
  background: var(--surface-1); color: var(--text-primary); text-decoration: none; cursor: pointer; }
.btn:hover { background: var(--wash); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
code { font-size: 12px; background: var(--wash); padding: 1px 5px; border-radius: 4px; }
.subnav { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: -10px 0 20px; }
.subnav a { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 14px; border: 1px solid var(--border); color: var(--text-secondary); text-decoration: none; }
.subnav a:hover { color: var(--text-primary); background: var(--wash); }
.subnav a[aria-current="page"] { color: var(--surface-1); background: var(--text-primary); border-color: var(--text-primary); }
.subnav-sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.tk-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 12px 0; }
.tk-card { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; text-decoration: none; color: var(--text-primary); }
.tk-card:hover { background: var(--wash); }
.tk-card span { font-size: 12px; color: var(--text-secondary); }
table.compare tr.group td { text-align: left; background: var(--wash); }
ul.news { list-style: none; padding: 0; margin: 6px 0 16px; }
ul.news li { padding: 7px 0; border-top: 1px solid var(--grid); display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
ul.news li:first-child { border-top: none; }
.news-meta { font-size: 12px; color: var(--text-muted); }
#news h3 { margin-top: 14px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; margin: 12px 0 8px; font-size: 14px; }
.controls fieldset { border: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.controls legend { float: left; margin-right: 8px; color: var(--text-secondary); font-weight: 600; }
.controls label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
.controls select { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
table.markets th { padding: 0; vertical-align: bottom; }
table.markets th button { all: unset; box-sizing: border-box; display: block; width: 100%; padding: 6px 10px; cursor: pointer; text-align: inherit;
  color: var(--text-secondary); font-weight: 600; white-space: normal; min-width: 64px; }
table.markets th button:hover, table.markets th[aria-sort] button { color: var(--text-primary); }
table.markets th button:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; border-radius: 4px; }
table.markets th[aria-sort="descending"] button::after { content: " ▼"; font-size: 10px; }
table.markets th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 10px; }
table.markets td.text { text-align: left; white-space: normal; min-width: 90px; }
table.markets .ticker { display: block; font-size: 11px; color: var(--text-muted); }
dl.terms { display: grid; grid-template-columns: 190px 1fr; gap: 6px 14px; margin: 10px 0; font-size: 14px; }
dl.terms dt { font-weight: 600; }
dl.terms dd { margin: 0; color: var(--text-secondary); }
@media (max-width: 640px) {
  dl.terms { grid-template-columns: 1fr; }
  .findings li { grid-template-columns: 1fr; gap: 4px; }
  .card { padding: 18px 16px; }
}
</style>
</head>
<body>
<div class="viz-root">
<div class="wrap">
{{BODY}}
</div>
</div>
<script type="application/json" id="chart-data">{{CHART_DATA}}</script>
<script>
(function () {
  "use strict";
  // Cold / Warm / Hot badge on the GEX / DIX tab, from output/gex_status.json (works when served by the hub).
  const b = document.querySelector("[data-gex-badge]");
  if (!b) return;
  fetch("gex_status.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).then((s) => {
    if (!s || !s.temp) return;
    b.textContent = s.temp.charAt(0).toUpperCase() + s.temp.slice(1) + (s.state === "up_to_date" ? " \u2713" : "");
    b.dataset.temp = s.state === "up_to_date" ? "" : s.temp;
    b.hidden = false;
    b.parentElement.title = s.label;
    b.setAttribute("aria-label", s.label);
  }).catch(() => {});
})();
</script>
<script>
(function () {
  "use strict";
  const DATA = JSON.parse(document.getElementById("chart-data").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const root = document.querySelector(".viz-root");
  const tok = (name) => getComputedStyle(root).getPropertyValue(name).trim();
  const SLOTS = ["--series-1", "--series-2", "--series-3"];

  function fmt(v, format, axis, unsigned) {
    if (v === null || v === undefined || !isFinite(v)) return "–";
    if (format === "pct") {
      const d = axis ? (Math.abs(v) < 0.01 ? 2 : 1) : 2;
      const s = (v * 100).toFixed(d);
      if (Number(s) === 0) return (0).toFixed(d) + "%";
      return (v > 0 && !axis && !unsigned ? "+" : "") + s + "%";
    }
    if (format === "mult") return v.toFixed(axis ? 1 : 2) + "×";
    if (format === "dollar") { const a = Math.abs(v); const n = a > 0 && a < .01 ? a.toPrecision(3) : (a >= 10 || (axis && Number.isInteger(a)) ? a.toFixed(0) : a.toFixed(2)); return (v < 0 ? "-" : "") + "$" + n; }
    return v.toFixed(axis ? 1 : 2);
  }

  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function shortDate(iso) { const [y, mo, d] = iso.split("-").map(Number); return MONTHS[mo - 1] + " " + d; }
  function longDate(iso) { const [y, mo, d] = iso.split("-").map(Number); return MONTHS[mo - 1] + " " + d + ", " + y; }

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }

  function niceTicks(min, max, count) {
    count = count || 5;
    if (min === max) { min -= 1; max += 1; }
    const span = max - min;
    const raw = span / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const r = raw / mag;
    const step = (r >= 7.5 ? 10 : r >= 3.5 ? 5 : r >= 1.5 ? 2 : 1) * mag;
    const lo = Math.floor(min / step + 1e-9) * step;
    const hi = Math.ceil(max / step - 1e-9) * step;
    const out = [];
    for (let x = lo; x <= hi + step * 1e-6; x += step) out.push(Number(x.toFixed(10)));
    return out;
  }

  function logTicks(min, max) {
    const out = [];
    for (let e = Math.floor(Math.log10(min)) - 1; e <= Math.ceil(Math.log10(max)) + 1; e++) {
      for (const m of [1, 2, 5]) {
        const v = m * Math.pow(10, e);
        if (v >= min * 0.98 && v <= max * 1.02) out.push(v);
      }
    }
    if (out.length < 2) return [min, max];
    return out;
  }

  function legend(container, series, kind) {
    if (series.length < 2) return;
    const row = document.createElement("div");
    row.className = "legend-row";
    series.forEach((s, i) => {
      const item = document.createElement("span");
      const key = document.createElement("i");
      key.className = kind === "line" ? "key-line" : "key-rect";
      key.style.background = tok(SLOTS[i]);
      item.appendChild(key);
      item.appendChild(document.createTextNode(s.name));
      row.appendChild(item);
    });
    container.parentNode.insertBefore(row, container);
  }

  function tooltip(container) {
    let tt = container.querySelector(".tooltip");
    if (!tt) { tt = document.createElement("div"); tt.className = "tooltip"; container.appendChild(tt); }
    return {
      show(title, rows, x, y) {
        tt.replaceChildren();
        const t = document.createElement("div"); t.className = "tt-title"; t.textContent = title; tt.appendChild(t);
        rows.forEach((r) => {
          const row = document.createElement("div"); row.className = "tt-row";
          const key = document.createElement("i"); key.className = "key-line"; key.style.background = r.color;
          const val = document.createElement("strong"); val.textContent = r.value;
          const name = document.createElement("span"); name.className = "name"; name.textContent = r.name;
          row.append(key, val, name); tt.appendChild(row);
        });
        tt.style.display = "block";
        const w = tt.offsetWidth, cw = container.clientWidth;
        let left = x + 14; if (left + w > cw) left = x - w - 14; if (left < 0) left = 0;
        tt.style.left = left + "px"; tt.style.top = Math.max(0, y - 10) + "px";
      },
      hide() { tt.style.display = "none"; },
    };
  }

  function wrapWords(text, maxChars) {
    const words = text.split(" "); const lines = []; let cur = "";
    words.forEach((w) => {
      if ((cur + " " + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else { cur = (cur + " " + w).trim(); }
    });
    if (cur) lines.push(cur);
    return lines.slice(0, 3);
  }

  // ------------------------------------------------------------------ line chart
  function lineChart(box, spec) {
    box.replaceChildren();
    const W = Math.max(320, box.clientWidth), H = 320;
    const n = spec.x.length;
    const daily = spec.xUnit === "day";
    const all = spec.series.flatMap((s) => s.values).filter((v) => v !== null);
    let ymin = spec.yMin !== undefined ? spec.yMin : Math.min.apply(null, all);
    let ymax = spec.yMax !== undefined ? spec.yMax : Math.max.apply(null, all);
    let ticks;
    if (spec.log) { ticks = logTicks(ymin, ymax); ymin = Math.min(ymin, ticks[0]); ymax = Math.max(ymax, ticks[ticks.length - 1]); }
    else { ticks = niceTicks(ymin, ymax, 5); ymin = ticks[0]; ymax = ticks[ticks.length - 1]; }
    const f = spec.log ? Math.log : (v) => v;
    const last = (s) => { for (let i = n - 1; i >= 0; i--) if (s.values[i] !== null) return i; return -1; };

    const m = { l: 52, r: 16, t: 12, b: 28 };
    const Yraw = (v, mt, mb) => mt + (1 - (f(v) - f(ymin)) / (f(ymax) - f(ymin))) * (H - mt - mb);
    // Direct end labels only when they won't collide.
    const ends = spec.series.map((s) => Yraw(s.values[last(s)], m.t, m.b)).sort((a, b) => a - b);
    let labelsFit = spec.series.length <= 4 && W >= 560;
    for (let i = 1; i < ends.length; i++) if (ends[i] - ends[i - 1] < 15) labelsFit = false;
    if (labelsFit) m.r = 124;
    const X = (i) => m.l + (i / (n - 1)) * (W - m.l - m.r);
    const Y = (v) => Yraw(v, m.t, m.b);

    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, tabindex: 0, role: "img", "aria-label": spec.title }, box);
    ticks.forEach((tv) => {
      const y = Y(tv);
      el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: tok("--grid"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
      const t = el("text", { x: m.l - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: tok("--text-muted") }, svg);
      t.textContent = fmt(tv, spec.format, true);
    });
    if (spec.yMin !== undefined && spec.yMin < 0 && spec.yMax > 0) {
      el("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: tok("--axis"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
    }
    el("line", { x1: m.l, x2: W - m.r, y1: H - m.b, y2: H - m.b, stroke: tok("--axis"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
    if (daily) {
      // Date ticks: about one every 90px.
      const k = Math.max(1, Math.ceil(n / Math.max(2, Math.floor((W - m.l - m.r) / 90))));
      for (let i = 0; i < n; i += k) {
        const t = el("text", { x: X(i), y: H - m.b + 17, "text-anchor": "middle", "font-size": 11, fill: tok("--text-muted") }, svg);
        t.textContent = shortDate(spec.x[i]);
      }
    } else {
      // Year ticks along the bottom.
      const years = [];
      for (let i = 1; i < n; i++) if (spec.x[i].slice(0, 4) !== spec.x[i - 1].slice(0, 4)) years.push(i);
      const every = W < 640 ? 4 : 2;
      years.forEach((i) => {
        const yr = Number(spec.x[i].slice(0, 4));
        if (yr % every !== 0) return;
        const t = el("text", { x: X(i), y: H - m.b + 17, "text-anchor": "middle", "font-size": 11, fill: tok("--text-muted") }, svg);
        t.textContent = String(yr);
      });
    }
    spec.series.forEach((s, si) => {
      let d = ""; let pen = false;
      s.values.forEach((v, i) => {
        if (v === null) { pen = false; return; }
        d += (pen ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); pen = true;
      });
      el("path", { d, fill: "none", stroke: tok(SLOTS[si]), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
      if (labelsFit) {
        const li = last(s);
        el("circle", { cx: X(li), cy: Y(s.values[li]), r: 4, fill: tok(SLOTS[si]), stroke: tok("--surface-1"), "stroke-width": 2 }, svg);
        const t = el("text", { x: X(li) + 9, y: Y(s.values[li]) + 4, "font-size": 12, fill: tok("--text-secondary") }, svg);
        t.textContent = s.name + " " + fmt(s.values[li], spec.format);
      }
    });
    legend(box, spec.series, "line");

    // Crosshair + tooltip (mouse and keyboard).
    const tip = tooltip(box);
    const cross = el("line", { y1: m.t, y2: H - m.b, stroke: tok("--axis"), "stroke-width": 1, visibility: "hidden" }, svg);
    const dots = spec.series.map((s, si) => el("circle", { r: 4, fill: tok(SLOTS[si]), stroke: tok("--surface-1"), "stroke-width": 2, visibility: "hidden" }, svg));
    let cur = n - 1;
    function showAt(i, px, py) {
      cur = Math.max(0, Math.min(n - 1, i));
      const x = X(cur);
      cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
      const rows = [];
      spec.series.forEach((s, si) => {
        const v = s.values[cur];
        if (v === null) { dots[si].setAttribute("visibility", "hidden"); return; }
        dots[si].setAttribute("cx", x); dots[si].setAttribute("cy", Y(v)); dots[si].setAttribute("visibility", "visible");
        rows.push({ color: tok(SLOTS[si]), value: fmt(v, spec.format), name: s.name });
      });
      const scale = box.clientWidth / W;
      tip.show(daily ? longDate(spec.x[cur]) : "Week of " + spec.x[cur], rows, (px !== undefined ? px : x * scale), (py !== undefined ? py : m.t));
    }
    function hide() { cross.setAttribute("visibility", "hidden"); dots.forEach((d) => d.setAttribute("visibility", "hidden")); tip.hide(); }
    const hit = el("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b, fill: "transparent" }, svg);
    hit.addEventListener("pointermove", (e) => {
      const rect = svg.getBoundingClientRect(); const scale = rect.width / W;
      const vx = (e.clientX - rect.left) / scale;
      const i = Math.round(((vx - m.l) / (W - m.l - m.r)) * (n - 1));
      showAt(i, e.clientX - rect.left, e.clientY - rect.top);
    });
    hit.addEventListener("pointerleave", hide);
    svg.addEventListener("focus", () => showAt(cur));
    svg.addEventListener("blur", hide);
    svg.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { showAt(cur - (daily ? 1 : 4)); e.preventDefault(); }
      if (e.key === "ArrowRight") { showAt(cur + (daily ? 1 : 4)); e.preventDefault(); }
    });
  }

  // ------------------------------------------------------------------ bar chart
  function barPath(x, w, y0, y1, r) {
    const h = Math.abs(y1 - y0); r = Math.min(r, h, w / 2);
    if (h < 0.5) return `M${x},${y0}H${x + w}`;
    if (y1 < y0) { // grows up: round the top
      return `M${x},${y0}V${y1 + r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 + r}V${y0}Z`;
    }
    return `M${x},${y0}V${y1 - r}Q${x},${y1} ${x + r},${y1}H${x + w - r}Q${x + w},${y1} ${x + w},${y1 - r}V${y0}Z`;
  }

  function barChart(box, spec) {
    box.replaceChildren();
    const W = Math.max(320, box.clientWidth), H = 300;
    const ns = spec.series.length, nc = spec.categories.length;
    const vals = spec.series.flatMap((s) => s.values).filter((v) => v !== null);
    const ref = spec.reference ? spec.reference.value : null;
    let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
    if (ref !== null) { lo = Math.min(lo, ref); hi = Math.max(hi, ref); }
    const pad = (hi - lo) * 0.12; // room for cap labels
    const ticks = niceTicks(lo < 0 ? lo - pad : lo, hi + pad, 5);
    const ymin = ticks[0], ymax = ticks[ticks.length - 1];
    const band0 = (W - 52 - 16) / nc;
    const maxChars = Math.max(8, Math.floor(band0 / 6.6));
    const wrapped = spec.categories.map((c) => wrapWords(c, maxChars));
    const lines = Math.max(...wrapped.map((w) => w.length));
    const m = { l: 52, r: ref !== null ? 92 : 16, t: 16, b: 18 + lines * 14 };
    const band = (W - m.l - m.r) / nc;
    const gap = 2;
    const bw = Math.max(6, Math.min(24, (band * 0.62 - gap * (ns - 1)) / ns));
    const gw = ns * bw + (ns - 1) * gap;
    const Y = (v) => m.t + (1 - (v - ymin) / (ymax - ymin)) * (H - m.t - m.b);
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": spec.title }, box);
    ticks.forEach((tv) => {
      const y = Y(tv);
      el("line", { x1: m.l, x2: W - m.r, y1: y, y2: y, stroke: tok("--grid"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
      const t = el("text", { x: m.l - 8, y: y + 4, "text-anchor": "end", "font-size": 11, fill: tok("--text-muted") }, svg);
      t.textContent = fmt(tv, spec.format, true);
    });
    const tip = tooltip(box);
    // Cap labels only where they can't collide: single-series charts with room per bar.
    const showLabels = ns === 1 && band >= 48;
    const F = (v) => fmt(v, spec.format, false, spec.unsigned);
    spec.categories.forEach((cat, ci) => {
      const gx = m.l + band * ci + (band - gw) / 2;
      spec.series.forEach((s, si) => {
        const v = s.values[ci];
        if (v === null) return;
        const x = gx + si * (bw + gap);
        const bar = el("path", { d: barPath(x, bw, Y(0), Y(v), 4), fill: tok(SLOTS[si]), tabindex: 0, role: "img",
          "aria-label": `${cat}, ${s.name}: ${F(v)}` }, svg);
        if (showLabels) {
          const up = v >= 0;
          const t = el("text", { x: x + bw / 2, y: up ? Y(v) - 6 : Y(v) + 14, "text-anchor": "middle", "font-size": 11, fill: tok("--text-secondary") }, svg);
          t.textContent = F(v);
        }
        // A hit area bigger than the bar itself.
        const hitTop = Math.min(Y(v), Y(0)) - 14, hitH = Math.abs(Y(v) - Y(0)) + 28;
        const hit = el("rect", { x: x - 3, y: hitTop, width: bw + 6, height: hitH, fill: "transparent" }, svg);
        const on = (px, py) => {
          bar.setAttribute("opacity", "0.82");
          const rows = spec.series.map((ss, k) => ({ color: tok(SLOTS[k]), value: F(ss.values[ci]), name: ss.name }));
          tip.show(cat, rows, px, py);
        };
        const off = () => { bar.setAttribute("opacity", "1"); tip.hide(); };
        hit.addEventListener("pointermove", (e) => { const r = svg.getBoundingClientRect(); on(e.clientX - r.left, e.clientY - r.top); });
        hit.addEventListener("pointerleave", off);
        bar.addEventListener("focus", () => { const scale = box.clientWidth / W; on((x + bw) * scale, Y(v) * scale); });
        bar.addEventListener("blur", off);
      });
      wrapped[ci].forEach((line, li) => {
        const t = el("text", { x: m.l + band * ci + band / 2, y: H - m.b + 16 + li * 14, "text-anchor": "middle", "font-size": 11, fill: tok("--text-secondary") }, svg);
        t.textContent = line;
      });
    });
    el("line", { x1: m.l, x2: W - m.r, y1: Y(0), y2: Y(0), stroke: tok("--axis"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
    if (ref !== null) {
      el("line", { x1: m.l, x2: W - m.r, y1: Y(ref), y2: Y(ref), stroke: tok("--text-muted"), "stroke-width": 1, "shape-rendering": "crispEdges" }, svg);
      const t = el("text", { x: W - m.r + 6, y: Y(ref) + 4, "font-size": 11, fill: tok("--text-muted") }, svg);
      t.textContent = fmt(ref, spec.format) + " " + spec.reference.label;
    }
    legend(box, spec.series, "bar");
  }

  function renderAll() {
    document.querySelectorAll(".legend-row").forEach((n) => n.remove());
    document.querySelectorAll(".chart[data-chart]").forEach((box) => {
      const spec = DATA[box.getAttribute("data-chart")];
      if (!spec) return;
      (spec.type === "line" ? lineChart : barChart)(box, spec);
    });
  }
  renderAll();
  let t;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(renderAll, 150); });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderAll);
})();
</script>
</body>
</html>
